      <stop offset="0%" stop-color="#dfa86b" />
      <stop offset="50%" stop-color="#8a542a" />
      <stop offset="100%" stop-color="#3d2110" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd599" />
